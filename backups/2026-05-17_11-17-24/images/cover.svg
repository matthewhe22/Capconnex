<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f2240"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a951"/>
      <stop offset="100%" stop-color="#d4bc6e"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#c8a951" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <!-- Large abstract arcs -->
  <path d="M -100 400 C 200 100, 400 700, 600 300" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <path d="M 400 700 C 600 300, 800 100, 1100 400" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>
  <path d="M 200 600 C 400 450, 500 350, 700 500" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.25"/>
  
  <!-- Accent dots -->
  <circle cx="300" cy="200" r="3" fill="#c8a951" opacity="0.4"/>
  <circle cx="600" cy="450" r="2" fill="#c8a951" opacity="0.3"/>
  <circle cx="900" cy="180" r="4" fill="#c8a951" opacity="0.35"/>
  <circle cx="150" cy="450" r="2" fill="#c8a951" opacity="0.25"/>
  <circle cx="1050" cy="500" r="2.5" fill="#c8a951" opacity="0.3"/>
  
  <!-- Glowing center glow -->
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#c8a951" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#c8a951" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="600" cy="300" rx="400" ry="200" fill="url(#glow)"/>
</svg>
