<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 56" width="390" height="56">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a951"/>
      <stop offset="50%" stop-color="#e0c878"/>
      <stop offset="100%" stop-color="#c8a951"/>
    </linearGradient>
    <linearGradient id="cL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a951"/>
      <stop offset="100%" stop-color="#b8963e"/>
