    <circle cx="21" cy="20" r="3.8" fill="url(#goldGrad)"/>
    <circle cx="21" cy="20" r="5.5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Text block -->
  <g transform="translate(62, 0)">
    <text x="0" y="32" font-family="'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#0a1628" letter-spacing="2.3">CAPCONNEX</text>
    <text x="0" y="47" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c8a951" letter-spacing="3.8">INVESTMENT</text>
