<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Capconnex">
  <title>Capconnex — Variant H · Aperture lens</title>
  <!-- Open circle (lens / aperture) with gold chord — "transparent calculations / no black boxes" -->
  <g transform="translate(22, 18)">
    <!-- Outer ring -->
    <circle cx="42" cy="42" r="38" fill="none" stroke="#0A1628" stroke-width="6"/>
    <!-- Inner chord (gold horizontal slash, off-center) — the aperture opening -->
    <line x1="10" y1="50" x2="74" y2="34" stroke="#C8A951" stroke-width="6" stroke-linecap="round"/>
    <!-- Small gold dot indicating "focal point" -->
    <circle cx="42" cy="42" r="3.5" fill="#C8A951"/>
  </g>

  <!-- Wordmark -->
  <text
    x="125"
    y="72"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="2"
    fill="#0A1628"
  >capconnex</text>
</svg>
