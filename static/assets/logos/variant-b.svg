<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Capconnex">
  <title>Capconnex — Variant B · Isometric layers + diagonal accent</title>
  <!-- Three stacked isometric rhombuses (property + data + energy layers) with a gold diagonal -->
  <g transform="translate(30, 12)">
    <!-- Top layer (lightest) -->
    <polygon
      points="40,8 76,24 40,40 4,24"
      fill="#142238"
    />
    <!-- Middle layer -->
    <polygon
      points="40,40 76,56 40,72 4,56"
      fill="#0A1628"
    />
    <!-- Bottom layer (darkest) -->
    <polygon
      points="40,72 76,88 40,104 4,88"
      fill="#050B16"
    />
    <!-- Gold diagonal line cutting through all three layers -->
    <line
      x1="6"
      y1="92"
      x2="74"
      y2="20"
      stroke="#C8A951"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Gold accent dot at the top of the diagonal -->
    <circle cx="74" cy="20" r="4" fill="#C8A951"/>
  </g>

  <!-- Wordmark — placed to the right -->
  <text
    x="125"
    y="62"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="3"
    fill="#0A1628"
  >CAPCONNEX</text>
  <!-- Tagline-style descriptor underneath -->
  <text
    x="125"
    y="86"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="3.5"
    fill="#C8A951"
  >INVESTMENT · APPLIED AI</text>
</svg>
