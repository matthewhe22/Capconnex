<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Capconnex">
  <title>Capconnex — Variant P · Gold P (Property/Pencil)</title>
  <!--
    The "P" letter in "caPconnex" is rendered in gold — P for Property + Pencil (your core).
    Auspicious: capital letter form, no X, no crosses.
    The P is hand-drawn so it sits cleanly with the rest of the text.
  -->
  <!-- "ca" -->
  <text
    x="20"
    y="76"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="56"
    font-weight="800"
    letter-spacing="-1"
    fill="#0A1628"
  >ca</text>

  <!-- Custom gold P — vertical stem + bowl -->
  <g transform="translate(82, 28)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="9" height="48" fill="#C8A951"/>
    <!-- Bowl (filled half circle on the upper-right of the stem) -->
    <path
      d="M 9 0 A 13 13 0 0 1 9 26 L 9 0 Z"
      fill="#C8A951"
    />
  </g>

  <!-- "connex" -->
  <text
    x="113"
    y="76"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="56"
    font-weight="800"
    letter-spacing="-1"
    fill="#0A1628"
  >connex</text>
</svg>
