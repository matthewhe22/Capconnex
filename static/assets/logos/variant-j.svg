<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Capconnex">
  <title>Capconnex — Variant J · X node mark</title>
  <!--
    Mark = an X drawn as 4 connection lines meeting at a central node.
    The X is both the letter X (last letter of capconneX) and a network hub.
    4 navy endpoints + 1 gold center node + gold crossing strokes.
  -->
  <g transform="translate(20, 18)">
    <!-- Two crossing strokes (gold) -->
    <line x1="6" y1="6" x2="78" y2="78" stroke="#C8A951" stroke-width="6" stroke-linecap="round"/>
    <line x1="78" y1="6" x2="6" y2="78" stroke="#C8A951" stroke-width="6" stroke-linecap="round"/>
    <!-- 4 endpoint nodes (navy dots) -->
    <circle cx="6" cy="6" r="5" fill="#0A1628"/>
    <circle cx="78" cy="6" r="5" fill="#0A1628"/>
    <circle cx="6" cy="78" r="5" fill="#0A1628"/>
    <circle cx="78" cy="78" r="5" fill="#0A1628"/>
    <!-- Central hub (slightly larger gold node with navy ring) -->
    <circle cx="42" cy="42" r="9" fill="#0A1628"/>
    <circle cx="42" cy="42" r="5" fill="#C8A951"/>
  </g>

  <!-- Wordmark — "capconne" then the mark IS the X -->
  <text
    x="120"
    y="72"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="0"
    fill="#0A1628"
  >capconne</text>
  <!-- Inline mini-X echoing the icon, in gold, as the final letter -->
  <g transform="translate(290, 38)">
    <line x1="0" y1="0" x2="32" y2="36" stroke="#C8A951" stroke-width="7" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="0" y2="36" stroke="#C8A951" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
