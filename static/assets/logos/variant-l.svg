<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Capconnex">
  <title>Capconnex — Variant L · X-in-ring monogram</title>
  <!--
    Mark = bold gold X inside a navy ring. The ring is the "container" of capital/the connection field.
    Reads as a clean letter-mark that works as a favicon AND incorporates the X anchor.
    Wordmark: "capconne" + the mark itself reused/echoed as the final letter (smaller, gold X).
  -->
  <g transform="translate(20, 16)">
    <!-- Outer navy ring -->
    <circle cx="44" cy="44" r="40" fill="none" stroke="#0A1628" stroke-width="6"/>
    <!-- Bold gold X inside -->
    <line x1="22" y1="22" x2="66" y2="66" stroke="#C8A951" stroke-width="9" stroke-linecap="round"/>
    <line x1="66" y1="22" x2="22" y2="66" stroke="#C8A951" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Wordmark "capconne" -->
  <text
    x="125"
    y="72"
    font-family="Mulish, -apple-system, system-ui, sans-serif"
    font-size="44"
    font-weight="800"
    fill="#0A1628"
  >capconne</text>
  <!-- Final X — gold, echoes the ring's X -->
  <g transform="translate(297, 38)">
    <line x1="0" y1="0" x2="32" y2="36" stroke="#C8A951" stroke-width="7" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="0" y2="36" stroke="#C8A951" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
